  cache_dir: /l/users/daniil.orel/hf_cache/hub  # home quota is full; /l is visible from the compute nodes (not from the login node)
  dtype: float32
  max_input_tokens: 4096          # long-generation experiment: 1024-token texts plus the context wrapper
  context_style: chat                            # use the reference model's own chat template
  # previous references: HuggingFaceTB/SmolLM2-360M-Instruct @a10cc151 (80-90% detection), EleutherAI/pythia-410m (base LM, 2%)
  context_template: "{system}\n\n{user}\n\n"    # used only when context_style is plain
fit_scorer:
  pool_lengths: [32, 96, 192, 384]
  pool_lengths_toy: [16, 32]
  unit_settings:            # primary unit only for the first fit; add the ablation units below and re-run fit-scorer (pools/scores resume)
    - {unit: tokens, unit_tokens: 16, sentence_cap_tokens: 64}
  #  - {unit: tokens, unit_tokens: 8, sentence_cap_tokens: 64}
  #  - {unit: tokens, unit_tokens: 32, sentence_cap_tokens: 64}
  #  - {unit: sentence, unit_tokens: 16, sentence_cap_tokens: 64}
  objectives: [global, local]
  candidates: 8
  repeat_subset: 12
detection:
  alpha: 0.01
  min_visible_tokens: 32
  null_cohorts: [generator, human_web]
  combine_tail_ranks: maximum
  minimum_calibration_per_cohort: 1000
evaluation:
  bootstrap_replicates: 2000
  length_views: [64, 128, 256, 512]
  max_ablation_configs: 12
  ablation_prompts_per_config: 60
  max_confirmation_configs: 2
attacks:
  strong_paraphrase_seed0_prompts: 600
  wider_suite_seed0_prompts: 150
  crop_fractions: [0.5, 0.75]
  dilution_added_length_fractions: [0.25, 0.5, 1.0]
runtime:
  resume: true
  automatic_hyperparameter_search: false
  require_budget_manifest_for_large_runs: true
  paid_api_calls: 0
  device: auto
  kernels: torch            # reference PyTorch DeltaNet path (fla kernels measured: same bf16-level discrepancy; not needed at 0.8B)
  fork_prefix_cache: false  # flipped to true only after `selftest` passes the fork-equality check
  scoring_token_budget: 24576
  head_chunk_positions: 256
paths:
  root: .
  data_raw: data/raw
  data_prepared: data/prepared
  assets: assets
  runs: runs
stages:
  smoke:
    partition: smoke
    seeds: [0]
    keys: development
    scales: assets/scales_smoke.json
    generation: {max_new_tokens: 64, min_new_tokens: 16, candidates: 4}
    toy_calibration: true
  dev:
    partition: dev
    seeds: [0]
    keys: development
    scales: assets/scales.json
  ablation:
    partition: dev
    ablation_subset_only: true
    arms: [llm_global]
    seeds: [0]
    keys: development
    scales: assets/scales.json
  ablation_rw:              # same 60-prompt subset, seed-phrase keys (random_words family; make-keys --set randomwords)
    partition: dev
    ablation_subset_only: true
    arms: [base, poe_steer]
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
  ablation_rw128:           # length sweep: same subset and keys, outputs capped at 128 / 256 tokens (base too)
    partition: dev
    ablation_subset_only: true
    arms: [base, poe_steer]
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
    generation: {max_new_tokens: 128, min_new_tokens: 32}
  ablation_rw256:
    partition: dev
    ablation_subset_only: true
    arms: [base, poe_steer]
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
    generation: {max_new_tokens: 256, min_new_tokens: 48}
  ablation_rwr:             # same subset, low-incidence seed-phrase keys (make-keys --set randomwords_rare)
    partition: dev
    ablation_subset_only: true
    arms: [base, poe_steer]
    seeds: [0]
    keys: randomwords_rare
    scales: assets/scales.json
  # ---- larger-sample experiment (<= 5k outputs): 16 fresh seed-phrase keys, two frozen configurations ----
  conf_null:                # 400 clean texts per text domain (+ their human references) -> calibration cohorts
    partition: null_calibration
    arms: [base]
    seeds: [0]
    keys: confirmation
    limit_per_domain: 400
  conf_pos:                 # 600 fresh prompts x (base + 2 configurations); evaluated at the frozen calibration
    partition: positive_test
    arms: [base, wm_neutral, wm_decoy]
    seeds: [0]
    keys: confirmation
    scales: assets/scales.json
    frozen: true
  code:                     # MBPP: 400 tasks x (base + 2 configurations); executable tests = functional quality
    partition: code
    domains: [mbpp]
    arms: [base, wm_neutral, wm_decoy]
    seeds: [0]
    keys: confirmation
    scales: assets/scales.json
    generation: {max_new_tokens: 512, min_new_tokens: 0}
    frozen: true
  code100:                  # code follow-up: 100 of the 400 tasks, opened entropy gate (200 outputs)
    partition: code
    domains: [mbpp]
    arms: [base, wm_code]
    seeds: [0]
    keys: confirmation
    scales: assets/scales.json
    limit_per_domain: 100
    generation: {max_new_tokens: 512, min_new_tokens: 0}
  code100b:                 # code follow-up 2: same 100 tasks, gate fully open
    partition: code
    domains: [mbpp]
    arms: [base, wm_code2]
    seeds: [0]
    keys: confirmation
    scales: assets/scales.json
    limit_per_domain: 100
    generation: {max_new_tokens: 512, min_new_tokens: 0}
  ablation_cross_long:      # LONG generations (1024-token budget, 256 minimum): detection vs length, controller on/off
    partition: dev
    ablation_subset_only: true
    arms: [base, wm_cross30, wm_cross30f, wm_cross30s]
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
    generation: {max_new_tokens: 1024, min_new_tokens: 256}
  conf_cross:               # HELD-OUT confirmation of the cross-model watermark: unseen prompts, fresh keys, run once
    partition: positive_test
    limit_per_domain: 50
    arms: [base, wm_cross30, wm_c4, wm_c8, wm_c12, wm_c16, wm_c20, wm_c8w, wm_c16w, wm_c12wg, wm_c20wg, wm_c4g, wm_c6, wm_c6g, wm_c8g, wm_w64_c3]   # the job passes --arms base,wm_cross30,<chosen>
    seeds: [0]
    keys: confirmation
    scales: assets/scales.json
  conf_window:              # HELD-OUT confirmation of the bounded reference context (same prompts and keys as conf_cross), run once
    partition: positive_test
    limit_per_domain: 50
    arms: [wm_w64_c3]
    seeds: [0]
    keys: confirmation
    scales: assets/scales.json
  long_c:                   # long texts with the CHOSEN delivery: same key throughout vs four rotating keys (after selection)
    partition: dev
    ablation_subset_only: true
    arms: [base, wm_cross30, wm_c4, wm_c8, wm_c12, wm_c16, wm_c20, wm_c8w, wm_c16w, wm_c12wg, wm_c20wg, wm_cross30_rot, wm_c4_rot, wm_c8_rot, wm_c12_rot, wm_c16_rot, wm_c20_rot, wm_c8w_rot, wm_c16w_rot, wm_c12wg_rot, wm_c20wg_rot, wm_c4g, wm_c6, wm_c6g, wm_c8g, wm_c4g_rot, wm_c6_rot, wm_c6g_rot, wm_c8g_rot]
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
    generation: {max_new_tokens: 1024, min_new_tokens: 256}
  clean_draws:              # extra independent CLEAN draws of the same 60 dev prompts: the yardstick for "no worse than clean"
    partition: dev
    ablation_subset_only: true
    arms: [base]
    seeds: [1, 2, 3]
    keys: randomwords
    scales: assets/scales.json
  keylen4:                 # key-length experiment: 6 disjoint keys of exactly 4 words, same 60 dev prompts
    partition: dev
    ablation_subset_only: true
    arms: [wm_c4, wm_c2]
    seeds: [0]
    keys: len4
    scales: assets/scales.json
  keylen8:                 # key-length experiment: 6 disjoint keys of exactly 8 words, same 60 dev prompts
    partition: dev
    ablation_subset_only: true
    arms: [wm_c4, wm_c2]
    seeds: [0]
    keys: len8
    scales: assets/scales.json
  keylen10:                 # key-length experiment: 6 disjoint keys of exactly 10 words, same 60 dev prompts
    partition: dev
    ablation_subset_only: true
    arms: [wm_c4, wm_c2]
    seeds: [0]
    keys: len10
    scales: assets/scales.json
  keylen16:                 # key-length experiment: 6 disjoint keys of exactly 16 words, same 60 dev prompts
    partition: dev
    ablation_subset_only: true
    arms: [wm_c4, wm_c2]
    seeds: [0]
    keys: len16
    scales: assets/scales.json
  control_b0:               # pipeline control: beta = 0 through the cross-model sampler, same 60 prompts, 4-word keys
    partition: dev
    ablation_subset_only: true
    arms: [wm_c0]
    seeds: [0]
    keys: len4
    scales: assets/scales.json
  strength_fill:            # 512-token budget, 10-word keys: where between beta 2 and 4 does quality start to go?
    partition: dev
    ablation_subset_only: true
    arms: [wm_c25, wm_c3, wm_c35]
    seeds: [0]
    keys: len10
    scales: assets/scales.json
  window_dev:               # bounded reference context vs the whole-text arms (same prompts, keys and budget as strength_fill)
    partition: dev
    ablation_subset_only: true
    arms: [wm_w64_c3, wm_w64_c25]
    seeds: [0]
    keys: len10
    scales: assets/scales.json
  long_story:               # LONG stories: does the gentle push become detectable when the text is long?
    partition: dev
    domains: [writingprompts]
    arms: [base, wm_c2, wm_c3]
    seeds: [0]
    keys: len10
    scales: assets/scales.json
    generation: {max_new_tokens: 2048, min_new_tokens: 512}
  long_story_clean2:        # a SECOND clean draw of the same long-story prompts: the clean-vs-clean reference level
    partition: dev
    domains: [writingprompts]
    arms: [base]
    seeds: [1]
    keys: len10
    scales: assets/scales.json
    generation: {max_new_tokens: 2048, min_new_tokens: 512}
  long_null:                # length-matched clean texts: the threshold for long texts must come from long clean texts
    partition: null_calibration
    domains: [writingprompts]
    limit_per_domain: 600
    arms: [base]
    seeds: [0]
    keys: len10
    scales: assets/scales.json
    generation: {max_new_tokens: 2048, min_new_tokens: 512}
  ablation_tradeoff:        # detection vs quality as the controller's target rises (standard 512-token budget)
    partition: dev
    ablation_subset_only: true
    arms: [base, wm_cross30, wm_c4, wm_c8, wm_c12, wm_c16, wm_c20, wm_c8w, wm_c16w, wm_c12wg, wm_c20wg, wm_c4g, wm_c6, wm_c6g, wm_c8g]   # incumbent vs constant push (+ warm-up, + semantic guard)
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
  ablation_long768:         # genuinely long texts (EOS blocked until 768) -- which control law holds the mark?
    partition: dev
    ablation_subset_only: true
    arms: [base, wm_l_whole, wm_l_span, wm_l_win]
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
    generation: {max_new_tokens: 1024, min_new_tokens: 768}
  ablation_spans:           # (1) same key in every span vs (2) keys rotating across spans, 1024-token stories
    partition: dev
    ablation_subset_only: true
    arms: [base, wm_span1, wm_spanrot]
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
    generation: {max_new_tokens: 1024, min_new_tokens: 256}
  ablation_cross_llama:     # cross-model with Llama-3.2-1B-Instruct as the world
    partition: dev
    ablation_subset_only: true
    arms: [base, wm_cross30, wm_cross60]
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
  ablation_cross_instr:     # cross-model with an INSTRUCTION-TUNED reference (smollm2-360m-instruct)
    partition: dev
    ablation_subset_only: true
    arms: [base, wm_cross30, wm_cross60]
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
  ablation_cross_beta:      # cross-model strength sweep (the bridge attenuates beta: 10 cost only -0.02 nats)
    partition: dev
    ablation_subset_only: true
    arms: [base, wm_cross30, wm_cross60]
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
  ablation_cross:           # cross-model steering on the 60-prompt dev subset, seed-phrase keys
    partition: dev
    ablation_subset_only: true
    arms: [base, wm_cross]
    seeds: [0]
    keys: randomwords
    scales: assets/scales.json
  null_calibration: {partition: null_calibration, arms: [base], seeds: [0], keys: confirmation}
  null_test: {partition: null_test, arms: [base], seeds: [0], keys: confirmation}
  positive_test: {partition: positive_test, seeds: [0, 1], keys: confirmation, scales: assets/scales.json}
budgets:
  dev: {wall_hours: 24}
  null_calibration: {wall_hours: 36}
  null_test: {wall_hours: 36}
  positive_test: {wall_hours: 48}
