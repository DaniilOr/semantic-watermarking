# Development profile (spec Section 12 schema, extended).  All model-backed roles: Qwen/Qwen3.5-0.8B only.
experiment: prefix_world_semantic_watermark_qwen35_08b_v11
seed: 20260911
models:
  shared:
    id: Qwen/Qwen3.5-0.8B
    revision: 2fc06364715b967f1860aea9cf38778875588b17   # resolved immutable sha (HF lastModified 2026-03-02)
    model_class: Qwen3_5ForCausalLM
    text_only: true
    enable_thinking: false
    dtype: float32           # see config.py: bf16 batched-vs-single discrepancy (0.037 nats/token) would trip the 100x floor rule
  share_weights_across_roles: true
  roles: [generator, world_keyed, world_neutral, key_rarity, paraphraser, optional_judge]
arms: [base, budget_control, passive_prefix, llm_global, llm_local]
data:
  domains: [writingprompts, dolly, c4_realnewslike]
  domain_weights: [0.3333333333, 0.3333333333, 0.3333333334]
  groups_per_domain:
    smoke: 4
    scale_fit: 30
    dev: 50
    null_calibration: 700
    null_test: 700
    positive_test: 200
    donor_pool: 200
    ablation: 20          # per domain -> 60 dev prompts for ablations
  domain_budgets:            # extra domains prepared with `prepare-data --domains <d> --append`
    mbpp: {code: 400}
  writingprompts_candidate_cap: 6000
  reference_cap_tokens: 512
  allow_shortfall: false
keys:
  families: [common_single, rare_single, common_multi, rare_multi, random_digits]
  development_per_family: 4
  confirmation_per_selected_family: 16
  decoys_per_family: 20          # decoy bank for the secondary rank detector (100 keys), never used as targets
  neutral_prefix: "No additional background is specified."
scoring:
  primary: llm_global
  max_input_tokens: 4096
  initial_mode: full_teacher_forcing
  reductions_dtype: float32
  system_template: "You are a helpful assistant.\nBackground: {prefix}"
  user_message: "Write a coherent response."
generation:
  unit: tokens
  unit_tokens: 16
  sentence_cap_tokens: 64
  candidates: 8
  beta: 2.0
  standardized_gain_clip: 5.0
  active_fraction: 1.0
  temperature: 0.8
  top_p: 0.95
  top_k: 0
  min_new_tokens: 64
  max_new_tokens: 512
  dev_seeds: [0]
  confirmation_seeds: [0, 1]
arm_aliases:                # named variants of the extension arm (see docs/approach_and_results.md, recommended settings)
  wm_neutral: poe_steer     # presence detection: neutral push, adaptive ramp
  wm_decoy: poe_steer       # attribution: decoy-relative push, beta 15
  wm_code: poe_steer        # code variant: entropy gate opened (code is low-entropy), neutral push beta 10
  wm_code2: poe_steer       # code variant 2: gate fully open (full beta from 0.3 nats), pass rate is the guard
  wm_cross: poe_steer       # cross-model: generation by the main model, world by the reference model
  wm_cross30: poe_steer     # cross-model, stronger push (the vocabulary bridge attenuates the nominal beta)
  wm_cross60: poe_steer
  wm_cross30f: poe_steer    # same push, adaptive controller OFF: the mark is spread over the whole text
  wm_cross30s: poe_steer    # controller ON with a length-aware target (scaled by sqrt(budget/512))
  wm_span1: poe_steer       # (1) every span steered toward the SAME key (controller resets each span)
  wm_spanrot: poe_steer     # (2) spans ROTATE through 4 keys, so parts of one text carry different keys
  # Three control laws aimed at the SAME marking rate (0.219 nats-contrast per sd per token, i.e. a whole-text
  # t of 7 at 1024 tokens).  A target is a rate x sqrt(n), so each estimator needs its own number:
  # whole text n=1024 -> 7.0 | sliding window n=128 -> 2.5 | span reset n=64 -> 1.75.
  # Detection-vs-quality TRADE-OFF at the standard length (512 tokens): the controller's target is the one real knob.
  # wm_w*: whole-text statistic, target T = 6 / 8 (target 4 is wm_cross30, already measured).
  # wm_r*: sliding 128-token window at the same marking RATES (target = T * sqrt(128/512) = T/2).
  wm_w6: poe_steer
  wm_w8: poe_steer
  # Constant push, NO controller: distortion grows with beta^2 but signal at most linearly, so for a given amount of
  # signal a thin, even push is the least damaging delivery.  The adaptive controller delivers it in bursts instead
  # (top 10% of tokens carry 74-84% of the distortion; first 16 tokens get ~3.5x the mean push).
  wm_c4: poe_steer
  wm_c8: poe_steer
  wm_c12: poe_steer
  wm_c16: poe_steer
  wm_c20: poe_steer
  wm_c8w: poe_steer         # constant push with a 48-token warm-up: the opening of the answer is left (almost) alone
  wm_c16w: poe_steer
  wm_c12wg: poe_steer       # + semantic guard: no push on tokens with raw contrast > 1.0 (the key's own neighbourhood)
  wm_c20wg: poe_steer
  wm_r4: poe_steer
  wm_r6: poe_steer
  wm_r8: poe_steer
  wm_l_whole: poe_steer     # running mean over the whole text (the current default; the integrator that stalls)
  wm_l_span: poe_steer      # statistic reset every 64 tokens (sawtooth window)
  wm_l_win: poe_steer       # statistic over a sliding 128-token window (regulates the rate continuously)
  # <arm>_rot: the same delivery, but the key switches every 128 tokens through 4 keys (long-text rerun after selection)
  wm_cross30_rot: poe_steer
  wm_c4_rot: poe_steer
  wm_c8_rot: poe_steer
  wm_c12_rot: poe_steer
  wm_c16_rot: poe_steer
  wm_c20_rot: poe_steer
  wm_c8w_rot: poe_steer
  wm_c16w_rot: poe_steer
  wm_c12wg_rot: poe_steer
  wm_c20wg_rot: poe_steer
  # frontier fill-in after the early read of the sweep: the quality bar is crossed between 4 and 8; the guard is isolated from the warm-up
  wm_c4g: poe_steer
  wm_c4g_rot: poe_steer
  wm_c6: poe_steer
  wm_c6_rot: poe_steer
  wm_c6g: poe_steer
  wm_c6g_rot: poe_steer
  wm_c8g: poe_steer
  wm_c8g_rot: poe_steer
  wm_c2: poe_steer          # constant push 2: can a LONGER key make an even gentler push detectable?
  wm_c0: poe_steer          # CONTROL: the watermarking sampler with ZERO push -- must be indistinguishable from the clean arm
  wm_c25: poe_steer         # strength fill-in between the setting with no measurable cost (2) and the usable one (4)
  wm_c3: poe_steer
  wm_c35: poe_steer
  wm_w64_c3: poe_steer      # BOUNDED reference context (last 64-95 tokens): the key's influence no longer decays along the text
  wm_w64_c25: poe_steer
arm_overrides:
